spring.application.name=brasilemdados
server.port=${PORT:8080}

# ==================================
# POSTGRESQL (Railway e Fallback Local)
# ==================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/brasil_em_dados}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações explícitas do Hibernate para evitar falha de Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==================================
# INTELIGENCIA ARTIFICIAL
# ==================================
openai.api.key=${OPENAI_API_KEY:}